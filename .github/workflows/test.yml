name: CI

# Runs the regression test suite on every push and pull request.
# The suite guards the bugs from the audit: concept scoring, India
# markup on every price path, alert cooldown, dedup, and /health
# observability.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: pytest tests/ -v

      - name: Syntax check all modules
        run: |
          python -m compileall -q main.py config ingestion processing alerts bot storage utils